{% extends "base.html" %}

{% block title %}Create Recipe - Be My Guest{% endblock %}

{% block content %}
<div class="container my-5" style="max-width: 760px;">
    <a href="{% url 'recipes' %}" class="text-decoration-none fw-semibold mb-4 d-inline-block" style="color: #1b535d;">&larr; Back to Recipes</a>

    <div class="card shadow-sm border-0 p-4 p-md-5 rounded-4" style="padding: 3rem !important;">
      <h2 class="fw-bold mb-4" style="color: #1b535d;">Create New Recipe</h2>

        <form method="POST" enctype="multipart/form-data" novalidate>
            {% csrf_token %}

            <!-- Recipe Name -->
            <div class="mb-4">
                <label for="{{ form.recipe_name.id_for_label }}" class="form-label fw-semibold">Recipe Name</label>
                <input type="text" name="recipe_name" id="{{ form.recipe_name.id_for_label }}" value="{{ form.recipe_name.value|default_if_none:'' }}" class="form-control" required>
            </div>

            <!-- Description -->
            <div class="mb-4">
                <label for="{{ form.description.id_for_label }}" class="form-label fw-semibold">Description</label>
                <textarea name="description" id="{{ form.description.id_for_label }}" rows="3" class="form-control" required>{{ form.description.value|default_if_none:'' }}</textarea>
            </div>

            <!-- Grid Row: Prep, Cook, Servings, Difficulty -->
            <div class="row g-3 mb-4">
                <div class="col-6 col-md-3">
                      <label for="{{ form.preparation_time.id_for_label }}" class="form-label fw-semibold">Prep (min)</label>
                      <input type="number" name="preparation_time" id="{{ form.preparation_time.id_for_label }}" value="{{ form.preparation_time.value|default_if_none:'' }}" class="form-control" required>
                </div>
                <div class="col-6 col-md-3">
                      <label for="{{ form.cooking_time.id_for_label }}" class="form-label fw-semibold">Cook (min)</label>
                      <input type="number" name="cooking_time" id="{{ form.cooking_time.id_for_label }}" value="{{ form.cooking_time.value|default_if_none:'' }}" class="form-control" required>
                </div>
                <div class="col-6 col-md-3">
                    <label for="{{ form.servings.id_for_label }}" class="form-label fw-semibold">Servings</label>
                    <input type="number" name="servings" id="{{ form.servings.id_for_label }}" value="{{ form.servings.value|default_if_none:'' }}" class="form-control" required>
                </div>
                <div class="col-6 col-md-3">
                    <label for="{{ form.difficulty.id_for_label }}" class="form-label fw-semibold">Difficulty</label>
                    <input type="text" name="difficulty" id="{{ form.difficulty.id_for_label }}" value="{{ form.difficulty.value|default_if_none:'Easy' }}" placeholder="Easy" class="form-control" required>
                </div>
            </div>

            <!-- Ingredients -->
            <div class="mb-4">
                <label for="{{ form.ingredients_text.id_for_label }}" class="form-label fw-semibold">Ingredients (one item per line)</label>
                <textarea name="ingredients_text" id="{{ form.ingredients_text.id_for_label }}" rows="4" placeholder="3 bananas&#10;180g cake flour&#10;2 eggs" class="form-control" required>{{ form.ingredients_text.value|default_if_none:'' }}</textarea>
            </div>

            <!-- Instructions -->
            <div class="mb-4">
                <label for="{{ form.instructions_text.id_for_label }}" class="form-label fw-semibold">Instructions (one step per line)</label>
                <textarea name="instructions_text" id="{{ form.instructions_text.id_for_label }}" rows="4" placeholder="Preheat oven to 356°F&#10;Mix wet and dry ingredients&#10;Bake for 40 minutes" class="form-control" required>{{ form.instructions_text.value|default_if_none:'' }}</textarea>
            </div>

            <!-- Grid Row: Dietary Tags & Allergens -->
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                  <label for="{{ form.dietary_tags_text.id_for_label }}" class="form-label fw-semibold">Dietary Tags (comma-separated)</label>
                  <input type="text" name="dietary_tags_text" id="{{ form.dietary_tags_text.id_for_label }}" value="{{ form.dietary_tags_text.value|default_if_none:'' }}" placeholder="Vegetarian, Low Sugar" class="form-control">
                </div>
                <div class="col-md-6">
                  <label for="{{ form.allergens_text.id_for_label }}" class="form-label fw-semibold">Allergens (comma-separated)</label>
                  <input type="text" name="allergens_text" id="{{ form.allergens_text.id_for_label }}" value="{{ form.allergens_text.value|default_if_none:'' }}" placeholder="Dairy, Gluten, Eggs" class="form-control">
                </div>
            </div>

            <!-- Recipe Photo with expanded inner padding -->
            <div class="mb-5 p-4 bg-light rounded-3 border">
                <label for="{{ form.image.id_for_label }}" class="form-label fw-semibold mb-2">Recipe Photo</label>
                <input type="file" name="image" id="{{ form.image.id_for_label }}" accept="image/*" class="form-control bg-white" style="padding: 0.75rem 1rem;">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn w-100 py-3 rounded-pill text-white fw-semibold shadow-sm" style="background-color: #1b535d;">
              Publish Recipe
            </button>
        </form>
    </div>
</div>
{% endblock %}
