<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Be My Guest{% endblock %}</title>

  <!-- CSS Deliverables -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/normalize.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/skeleton.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  {% block head %}{% endblock %}
</head>
<body>

  <!-- App Header & Navigation Bar -->
  <header class="site-header">
    <div class="container">
      <a href="{{ url_for('home') }}" class="brand">
        <span class="brand__title">Be My Guest</span>
      </a>

      <!-- Navigation Tabs (From Wireframes) -->
      <nav class="nav" aria-label="Main Navigation">
        <a href="{{ url_for('recipes') }}" class="{% if request.endpoint == 'recipes' %}active{% endif %}">Recipes</a>
        <a href="{{ url_for('posts') }}" class="{% if request.endpoint == 'posts' %}active{% endif %}">Posts</a>
        <a href="{{ url_for('invitations') }}" class="{% if request.endpoint == 'invitations' %}active{% endif %}">Invitations</a>
      </nav>

      <!-- User Auth State Switcher -->
      <div class="auth-nav">
        {% if current_user and current_user.is_authenticated %}
          <a href="{{ url_for('logout') }}" class="button button-outline">Log Out</a>
        {% else %}
          <a href="{{ url_for('login') }}" class="button button-outline">Log In</a>
          <a href="{{ url_for('signup') }}" class="button button-secondary">Sign Up</a>
        {% endif %}
      </div>
    </div>
  </header>

  <!-- Main Container Page Content -->
  <main class="main-content">
    <div class="container">
      {% block content %}
      <!-- Specific page content will render here -->
      {% endblock %}
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; Be My Guest — Cozy gatherings & recipes.</p>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
